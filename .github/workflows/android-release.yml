name: Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.LANU_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LANU_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then STORE_PASSWORD="android-ci-store"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="android-ci-key"; fi
          keytool -genkeypair -v -keystore my-upload-key.jks -storetype JKS \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=PERMIUM LANU VPN, OU=LANU, O=LANU, L=Istanbul, ST=Istanbul, C=TR"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PERMIUM-LANU-VPN-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: PERMIUM LANU VPN v1.0.0-build.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

# Force a fresh release build after the latest repository update.

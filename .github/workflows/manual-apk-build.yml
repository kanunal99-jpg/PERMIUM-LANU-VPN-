name: Manual APK Build

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[APK BUILD]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks -storetype JKS             -alias upload -keyalg RSA -keysize 2048 -validity 10000             -storepass "android-ci-store" -keypass "android-ci-key"             -dname "CN=PERMIUM LANU VPN, OU=LANU, O=LANU, L=Istanbul, ST=Istanbul, C=TR"
          echo "STORE_PASSWORD=android-ci-store" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android-ci-key" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PERMIUM-LANU-VPN-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-issue-${{ github.event.issue.number || github.run_number }}
          name: PERMIUM LANU VPN v1.0.0-build-issue-${{ github.event.issue.number || github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
